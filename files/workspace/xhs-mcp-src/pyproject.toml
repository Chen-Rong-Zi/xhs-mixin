[project]
name = "jobson-xhs-mcp"
version = "0.1.1"
description = "小红书MCP服务器 (vendored for xhs-mixin) - 提供小红书API功能的MCP工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.10.0,<0.14.0",
    "mcp[cli]>=1.6.0,<2",
    "playwright>=1.58.0",
    "pyexecjs>=1.5.1",
    "requests>=2.32.3",
]
authors = [
    {name = "jobsonlook"}
]
license = {text = "MIT"}
keywords = ["mcp", "xiaohongshu", "api", "server"]

[project.scripts]
xhs-mcp = "xhs_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xhs_mcp"]
