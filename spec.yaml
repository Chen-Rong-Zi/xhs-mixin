schemaVersion: "2"
kind: mixin
name: xhs-query
displayName: Xiaohongshu Query
description: "Query Xiaohongshu notes and feeds via the xhs-mcp MCP server. Requires a Xiaohongshu cookie credential."

# 网络白名单：只允许访问这两个域（严格最小化，遵循用户要求）
permissions:
  network:
    allow:
      - xiaohongshu.com
      - edith.xiaohongshu.com

# 凭证：service: xhs。注意：xhs-mcp 是 Puppeteer 浏览器自动化 server，不读 XHS_COOKIE 环境变量、
# 工具也无 cookie 参数；容器内 XHS_COOKIE 只是宿主机托管凭证的占位符（信息性）。真实 cookie 通过
# 两条路径获得：1) 沙箱内 xhs_auth_login 扫码登录（推荐，登录态写入 ~/.xhs-mcp/cookies.json）；
# 2) 宿主机 ~/.config/sbx/credentials.yaml 中 xhs 的 binding + 出口代理注入（对浏览器流量未经实测）。
# proxyManaged 表示代理可向注入域发请求时替换该占位符（仅对非浏览器 HTTP 流量有效）。
credentials:
  - service: xhs
    description: "Xiaohongshu web/API cookie; keep it fresh — it expires and is fingerprint-linked."
    apiKey:
      name: XHS_COOKIE
      proxyManaged: true
      inject:
        - domain: edith.xiaohongshu.com
          header: Cookie
          format: "%s"
        - domain: xiaohongshu.com
          header: Cookie
          format: "%s"

# instructions 指向 context.md（v2 的 agentInstructions.content 只收内联 markdown，不能直接指文件路径，
# 所以这里写指引 + 通过 files/ 注入 context.md 到工作区，agent 可读）
agentInstructions:
  content: |
    # XHS Query mixin

    This sandbox can query Xiaohongshu (小红书). Before using the MCP tools,
    read the full instructions in `/workspace/context.md`.

    Available MCP tools under the `xhs-mcp` server:
    - `xhs_search_note` — search notes by keyword (`keyword` required)
    - `xhs_get_note_detail` — get a note's full detail by id (`feed_id` + `xsec_token` required)
    - `xhs_discover_feeds` — discover recommended feeds
    - `xhs_auth_login` — log in to Xiaohongshu (opens a browser to scan the app QR code)
    - `xhs_auth_logout` — log out / clear saved cookies
    - `xhs_auth_status` — check current login status

    xhs-mcp is a browser-automation server and does **not** read the `XHS_COOKIE`
    environment variable; no tool accepts a cookie argument. Login state lives in
    `~/.xhs-mcp/cookies.json`. To authenticate, call `xhs_auth_login` inside the
    sandbox (scan the QR code with the Xiaohongshu app). See `/workspace/context.md`
    for details.
